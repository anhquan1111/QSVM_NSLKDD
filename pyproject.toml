[project]
name = "qsvm-nslkdd"
version = "0.1.0"
description = "QSVM-IDS NISQ: Quantum Kernel SVM for Network Intrusion Detection (NSL-KDD, UNSW-NB15)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.3",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "qiskit==2.3.0",
    "qiskit-machine-learning==0.9.0",
    "xgboost==3.3.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "streamlit==1.55.0",
    "gdown==5.1.0",
    "notebook==7.5.4",
    "pywinpty==3.0.3; sys_platform == 'win32'",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.49.0",
]

[tool.uv]
# uv tạo môi trường ở .venv (khác venv/ cũ). Chạy: uv sync
